spring.application.name=vehicle-service


server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:Dis@2002}
spring.datasource.password=${DB_PASSWORD:Dis@2002}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true